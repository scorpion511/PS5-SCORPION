<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORPION HOST</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07090f;
      --bg-2: #0c1019;
      --panel: #0d1220;
      --panel-2: #131a2b;
      --line: #182030;
      --text: #d6e4ff;
      --dim: #8aa0c4;
      --accent: #00f0ff;
      --accent-2: #00f0ff;
      --ok: #00d48c;
      --warn: #ffd166;
      --err: #ff3b52;
    }

    html, body {
      height: 100%;
      background: radial-gradient(ellipse at top, #0c1019 0%, var(--bg) 65%);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      font-weight: 700;
    }

    #layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      height: 100vh;
    }

    /* ---------- LEFT ---------- */
    #ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      gap: 26px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative spinning rings in background */
    .bg-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0, 240, 255, 0.08);
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .bg-ring.r1 {
      width: 620px;
      height: 620px;
      animation: spin 24s linear infinite;
    }

    .bg-ring.r2 {
      width: 900px;
      height: 900px;
      border-style: dashed;
      border-color: rgba(0, 240, 255, 0.05);
      animation: spin 40s linear infinite reverse;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .brand h1 {
      font-size: 30px;
      letter-spacing: 6px;
      font-weight: 700;
      color: var(--accent-2);
      text-shadow: 0 0 24px rgba(0, 240, 255, 0.35);
    }

    .brand .dev {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--dim);
      text-transform: uppercase;
    }

    .brand .dev span {
      color: var(--accent);
      font-weight: 700;
    }

    /* ---------- RING LOADER ---------- */
    #ring-wrap {
      position: relative;
      width: 220px;
      height: 220px;
      z-index: 2;
    }

    #ring-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.25));
    }

    #ring-track {
      fill: none;
      stroke: rgba(0, 240, 255, 0.08);
      stroke-width: 6;
    }

    #ring-bar {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 565.48;
      stroke-dashoffset: 565.48;
      transition: stroke-dashoffset 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    /* Pulsing glow ring */
    #ring-pulse {
      fill: none;
      stroke: rgba(0, 240, 255, 0.35);
      stroke-width: 2;
      stroke-dasharray: 8 20;
      transform-origin: 100px 100px;
      animation: pulse-ring 2.5s linear infinite;
    }

    @keyframes pulse-ring {
      to { transform: rotate(360deg); }
    }

    #ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    #ring-pct {
      font-size: 42px;
      font-weight: 700;
      color: var(--accent-2);
      letter-spacing: 2px;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.5);
      font-variant-numeric: tabular-nums;
    }

    #ring-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--dim);
      margin-top: 4px;
      text-transform: uppercase;
    }

    #status {
      font-size: 14px;
      color: var(--dim);
      text-align: center;
      letter-spacing: 0.5px;
      min-height: 22px;
      z-index: 2;
    }

    #hint {
      font-size: 12px;
      color: #3a4860;
      letter-spacing: 2px;
      z-index: 2;
      transition: color 0.3s;
    }

    #hint.ready {
      color: var(--warn);
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }

    #console {
      width: min(680px, 90%);
      max-height: 22vh;
      overflow-y: auto;
      padding: 12px 16px;
      font-size: 12px;
      line-height: 1.55;
      color: #fff;
      background: rgba(12, 16, 25, 0.85);
      border: 1px solid var(--line);
      border-radius: 6px;
      white-space: pre-wrap;
      font-family: 'Courier New', Courier, monospace;
      z-index: 2;
    }

    #console::-webkit-scrollbar { width: 6px; }
    #console::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }

    #credit {
      position: absolute;
      bottom: 18px;
      left: 40px;
      font-size: 11px;
      color: #8aa0c4;
      letter-spacing: 2px;
      text-transform: uppercase;
      z-index: 2;
    }

    #credit span { color: var(--accent); font-weight: 700; text-shadow: 0 0 8px var(--accent); }

    /* ---------- RIGHT PANEL ---------- */
    #payloads {
      background: var(--panel);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      will-change: transform;
      transform: translateZ(0);
    }

    #payloads header {
      padding: 18px 22px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    #payloads header .title {
      font-size: 13px;
      letter-spacing: 4px;
      color: var(--accent-2);
      font-weight: 700;
    }

    #payloads header .count {
      font-size: 11px;
      color: var(--dim);
      background: var(--panel-2);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--line);
    }

    #controls-hint {
      padding: 10px 22px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #8aa0c4;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
    }

    #controls-hint b { color: var(--accent-2); font-weight: 700; }

    #list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      -webkit-overflow-scrolling: touch;
    }

    #list::-webkit-scrollbar { width: 6px; }
    #list::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }

    .payload {
      padding: 11px 22px;
      font-size: 13px;
      color: #d6e4ff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 3px solid transparent;
      transition: background-color 0.12s ease, border-color 0.12s ease;
      will-change: background-color;
      user-select: none;
    }

    .payload .check {
      width: 16px;
      height: 16px;
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      border-radius: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: transparent;
      transition: background-color 0.12s ease, border-color 0.12s ease;
    }

    .payload .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 700;
    }

    .payload .size {
      font-size: 11px;
      color: #8aa0c4;
      flex-shrink: 0;
    }

    .payload:hover {
      background-color: var(--panel-2);
      border-left-color: var(--accent);
      color: var(--text);
    }

    .payload.selected {
      background-color: rgba(0, 240, 255, 0.14);
      border-left-color: var(--accent-2);
      color: #fff;
    }

    .payload.selected .check {
      background-color: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .payload.cursor {
      outline: 1px dashed rgba(0, 240, 255, 0.35);
      outline-offset: -4px;
    }

    .payload.sending {
      color: var(--warn);
      border-left-color: var(--warn);
      background-color: rgba(255, 209, 102, 0.06);
    }

    .payload.sent {
      color: var(--ok);
      border-left-color: var(--ok);
      opacity: 0.6;
    }

    .payload.failed {
      color: var(--err);
      border-left-color: var(--err);
      background-color: rgba(255, 59, 82, 0.06);
    }

    #empty {
      padding: 40px 20px;
      text-align: center;
      color: #8aa0c4;
      font-size: 12px;
      letter-spacing: 1px;
    }

    #footer {
      padding: 14px 22px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

   #sendBtn {
      width: 100%;
      padding: 11px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #00a8b3);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
      box-shadow: 0 4px 14px rgba(0, 240, 255, 0.28);
      will-change: transform;
    }

    #sendBtn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0, 240, 255, 0.42);
    }

    #sendBtn:active:not(:disabled) {
      transform: translateY(0);
    }

    #sendBtn:disabled {
      background: #1a2233;
      color: #4a5878;
      cursor: not-allowed;
      box-shadow: none;
    }

    #resetBtn {
      width: 100%;
      padding: 8px;
      font-size: 11px;
      letter-spacing: 2px;
      font-family: inherit;
      color: var(--dim);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    #resetBtn:hover:not(:disabled) {
      color: var(--accent-2);
      border-color: var(--accent);
    }

    #resetBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 1024px) {
      #layout { grid-template-columns: 1fr 340px; }
    }

    @media (max-width: 780px) {
      #layout { grid-template-columns: 1fr; grid-template-rows: 1fr 340px; }
      #payloads { border-left: none; border-top: 1px solid var(--line); }
      .brand h1 { font-size: 24px; letter-spacing: 4px; }
      #credit { position: static; margin-top: 16px; }
    }

    @media (min-width: 2560px) {
      #layout { grid-template-columns: 1fr 480px; }
      #ring-wrap { width: 260px; height: 260px; }
      #ring-pct { font-size: 52px; }
      .brand h1 { font-size: 38px; }
    }
  </style>
</head>
<body>
  <div id="layout">

    <div id="ui">
      <div class="bg-ring r1"></div>
      <div class="bg-ring r2"></div>

      <div class="brand">
        <h1>SCORPION HOST</h1>
        <div class="dev">developed by <span>Ahmed ESSAM</span></div>
      </div>

      <div id="ring-wrap">
        <svg id="ring-svg" viewBox="0 0 200 200">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff"/>
              <stop offset="100%" stop-color="#00bcff"/>
            </linearGradient>
          </defs>

          <circle id="ring-track" cx="100" cy="100" r="90"/>
          <circle id="ring-pulse" cx="100" cy="100" r="90"/>
          <circle id="ring-bar" cx="100" cy="100" r="90"/>
        </svg>

        <div id="ring-text">
          <span id="ring-pct">0%</span>
          <span id="ring-label">loading</span>
        </div>
      </div>

      <div id="status">booting…</div>
      <div id="hint">waiting for exploit…</div>

      <div id="console"></div>

      <div id="credit">v1.0 · <span>Ahmed ESSAM</span></div>
    </div>

    <div id="payloads">
      <header>
        <span class="title">PAYLOADS</span>
        <span class="count" id="count">0</span>
      </header>

      <div id="controls-hint">
        <span><b>R1</b> toggle</span>
        <span><b>R2</b> run</span>
      </div>

      <div id="list">
        <div id="empty">loading…</div>
      </div>

      <div id="footer">
        <button id="sendBtn" disabled>SELECT PAYLOAD</button>
        <button id="resetBtn" disabled>CLEAR</button>
      </div>
    </div>

  </div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>

  <script type="module" src="./src/site.js"></script>

  <!-- ring loader hook -->
  <script>
    (function () {
      const bar    = document.getElementById('ring-bar');
      const pctEl  = document.getElementById('ring-pct');
      const label  = document.getElementById('ring-label');
      const status = document.getElementById('status');
      const hint   = document.getElementById('hint');

      const RING_LEN = 565.48;

      function setProgress(p, text) {
        p = Math.max(0, Math.min(100, p));
        const offset = RING_LEN - (RING_LEN * p / 100);
        bar.style.strokeDashoffset = offset;
        pctEl.textContent = Math.round(p) + '%';
        if (text) status.textContent = text;
      }

      const STAGE_MAP = [
        [/already/i,              100, 'jailbreak already active — payload sender ready'],
        [/webkit/i,               8,   'webkit exploit'],
        [/ARW/i,                  20,  'arbitrary read/write ready'],
        [/WebKit base/i,          25,  'webkit base leaked'],
        [/Starting kernel/i,      30,  'starting kernel exploit'],
        [/base 0x/i,              40,  'kernel base leaked'],
        [/read and write ready/i, 55,  'kernel rw ready'],
        [/fast read and write/i,  65,  'fast kernel rw ready'],
        [/privileges ready/i,     75,  'root + sandbox escape'],
        [/kexp/i,                 85,  'loading kernel payload'],
        [/elfldr/i,               92,  'elfldr is listening'],
        [/payloads loaded/i,      100, 'ready — select payloads'],
      ];

      const origWrite = window.writeLog;
      window.writeLog = function (message, type) {
        if (typeof origWrite === 'function') origWrite(message, type);
        const text = String(message);

        for (const [re, pct, str] of STAGE_MAP) {
          if (re.test(text)) {
            setProgress(pct, str);
            if (pct === 100) hint.classList.add('ready');
            break;
          }
        }

        if (type === 'error') {
          bar.style.stroke = '#ff3b52';
          status.textContent = 'failed: ' + text;
        }
      };

     window.__markReady = function (alreadyJailbroken) {
        setProgress(100, alreadyJailbroken
          ? 'jailbreak already active — payload sender ready'
          : 'ready — select payloads');
        hint.classList.add('ready');
        hint.textContent = 'R1 toggle · R2 run';
        if (window.__elfldrUI) window.__elfldrUI();
      };

      window.__setHint = function (txt) { hint.textContent = txt; };
    })();
  </script>

  <!-- payload panel -->
  <script>
    (function () {
      const listEl   = document.getElementById('list');
      const sendBtn  = document.getElementById('sendBtn');
      const resetBtn = document.getElementById('resetBtn');
      const countEl  = document.getElementById('count');

      let payloads = [];
      let selected = new Set();
      let cursor   = 0;
      let sending  = false;

      const formatSize = (b) =>
        b < 1024    ? b + ' B' :
        b < 1048576 ? (b / 1024).toFixed(1) + ' KB' :
                      (b / 1048576).toFixed(1) + ' MB';

      const isEtaHEN = (name) => /etahen/i.test(name);

      function orderQueue(names) {
        const normal  = [];
        const special = [];
        for (const n of names) {
          if (isEtaHEN(n)) special.push(n);
          else normal.push(n);
        }
        return [...normal, ...special];
      }

      function setRowState(name, state) {
        const el = document.querySelector(`.payload[data-name="${CSS.escape(name)}"]`);
        if (!el) return;
        el.classList.remove('sending', 'sent', 'failed');
        if (state) el.classList.add(state);
      }

      function updateSendButton() {
        if (sending) {
          sendBtn.textContent = 'RUNNING…';
          sendBtn.disabled = true;
          resetBtn.disabled = true;
          return;
        }
        const n = selected.size;
        sendBtn.textContent = n === 0
          ? 'SELECT PAYLOAD'
          : n === 1
            ? 'RUN 1 PAYLOAD (R2)'
            : `RUN ${n} PAYLOADS (R2)`;
        sendBtn.disabled = n === 0 || !window.__elfldrReady;
        resetBtn.disabled = n === 0;
      }

      function render() {
        countEl.textContent = payloads.length;

        if (!payloads.length) {
          listEl.innerHTML = '<div id="empty">no payloads found</div>';
          return;
        }

        listEl.innerHTML = '';
        payloads.forEach((p, i) => {
          const row = document.createElement('div');
          row.className = 'payload';
          row.dataset.name = p.name;
          row.dataset.index = i;
          row.innerHTML = `
            <span class="check">✓</span>
            <span class="name">${p.name}</span>
            <span class="size">${formatSize(p.size)}</span>
          `;
          row.addEventListener('click', () => {
            cursor = i;
            toggleSelect(p.name);
          });
          listEl.appendChild(row);
        });

        applySelectionVisuals();
      }

      function applySelectionVisuals() {
        document.querySelectorAll('.payload').forEach((el) => {
          const isSel = selected.has(el.dataset.name);
          el.classList.toggle('selected', isSel);
          el.classList.toggle('cursor', Number(el.dataset.index) === cursor);
        });
        updateSendButton();
      }

      function toggleSelect(name) {
        if (selected.has(name)) selected.delete(name);
        else selected.add(name);
        applySelectionVisuals();
      }

      function moveCursor(delta) {
        if (!payloads.length) return;
        cursor = (cursor + delta + payloads.length) % payloads.length;
        const el = document.querySelector(`.payload[data-index="${cursor}"]`);
        if (el) el.scrollIntoView({ block: 'nearest' });
        applySelectionVisuals();
      }

      async function loadList() {
        try {
          const res = await fetch('./payloads.php', { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          payloads = await res.json();
        } catch (err) {
          listEl.innerHTML = `<div id="empty">failed to load: ${err.message}</div>`;
          return;
        }
        render();
      }

      async function sendSelected() {
        if (sending) return;
        if (!selected.size) return;
        if (!window.__elfldrReady) {
          window.writeLog && window.writeLog('elfldr not ready', 'error');
          return;
        }

        sending = true;
        updateSendButton();

        const queue = orderQueue(
          payloads.filter((p) => selected.has(p.name)).map((p) => p.name)
        );

        window.writeLog && window.writeLog(
          `running ${queue.length} payload${queue.length > 1 ? 's' : ''} (etaHEN last)`,
          'info'
        );

        for (let i = 0; i < queue.length; i++) {
          const name = queue[i];
          setRowState(name, 'sending');
          window.writeLog && window.writeLog(`[${i + 1}/${queue.length}] ${name}`, 'info');

          try {
            await window.__sendPayload(name);
            setRowState(name, 'sent');
            window.writeLog && window.writeLog(`${name} sent`, 'info');
          } catch (err) {
            setRowState(name, 'failed');
            window.writeLog && window.writeLog(`${name} failed: ${err.message}`, 'error');
          }

          if (i < queue.length - 1) {
            await new Promise((r) => setTimeout(r, 1500));
          }
        }

        sending = false;
        updateSendButton();
        window.writeLog && window.writeLog('done', 'info');
      }

      function clearSelection() {
        selected.clear();
        applySelectionVisuals();
      }

      sendBtn.addEventListener('click', sendSelected);
      resetBtn.addEventListener('click', clearSelection);

      window.addEventListener('keydown', (e) => {
        const isR1 = e.key === 'F6' || e.key === 'R1' ||
                     (e.code === 'Unidentified' && e.keyCode === 117);
        const isR2 = e.key === 'F8' ||
                     (e.code === 'Unidentified' && e.keyCode === 119);
        const isUp   = e.key === 'ArrowUp';
        const isDown = e.key === 'ArrowDown';

        if (isR1) {
          e.preventDefault();
          if (payloads.length) toggleSelect(payloads[cursor].name);
        } else if (isR2) {
          e.preventDefault();
          sendSelected();
        } else if (isUp) {
          e.preventDefault();
          moveCursor(-1);
        } else if (isDown) {
          e.preventDefault();
          moveCursor(1);
        }
      }, true);

      window.__refreshPayloads = loadList;
      window.__elfldrUI = updateSendButton;

      const wait = setInterval(() => {
        if (window.__elfldrReady) {
          updateSendButton();
          clearInterval(wait);
        }
      }, 500);

      loadList();
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('[SW] Registered:', reg.scope))
          .catch((err) => console.error('[SW] Registration failed:', err));
      });
    }
  </script>
</body>
</html>
